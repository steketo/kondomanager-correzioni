; limiti di caricamento di docker/standard/Dockerfile a monte (nginx.conf: client_max_body_size 30M, sopra)
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
; il codice nell'immagine non cambia: nessun controllo delle date dei file
opcache.enable = 1
opcache.validate_timestamps = 0
