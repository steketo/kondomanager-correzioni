; worker di KondoManager: coda e scheduler sotto supervisor, senza interfaccia web, come l'utente del contenitore.
; startretries=1000: supervisor aspetta fra due tentativi tanti secondi quanti i tentativi fatti, quindi 1000 coprono
; circa 139 ore di database fermo (1+2+…+1000 s); con MySQL fermo 40 s la coda è uscita 10 volte ed è ripartita da
; sola (prova del 25/10). Oltre, il battito manca e la copia notturna manda /fail (dopo_copia dell'adattatore) ogni notte.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:coda]
command=php /var/www/artisan queue:work --sleep=3 --tries=3 --timeout=90
autorestart=true
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=php /var/www/artisan schedule:work
autorestart=true
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
